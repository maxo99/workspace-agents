

[project]
name = "workspace-agents"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.14"
dependencies = [
    # "crewai>=1.9.3",
    "python-dotenv>=1.0.1",
    "ipykernel>=6.29.0",
    # "crewai-tools[mcp]>=1.9.3",
    # "mcp>=1.23.3",
    "streamlit>=1.54.0",
    #
    #
    #
    "litellm==1.80.16",
    "google-adk[a2a]==1.19.0",
    "a2a-sdk[http-server]==0.3.16",
    "mcp==1.19.0",
    "agent-framework==1.0.0b251120",
    "agent-framework-a2a==1.0.0b251120",
    "langchain-mcp-adapters==0.1.11",
    "langgraph==1.0.2",
    "langchain==1.0.2",
    "langchain_litellm",
    "beeai-framework[a2a]==0.1.70",
    "nest_asyncio",
    "ipython",
    "python-dotenv",
    "langgraph-a2a-server==0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_researcher", "deeplearning_a2a"]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-few-public-methods
    "R0913", # too-many-arguments
    "R0914", # too-many-locals
    "W1203", # logging-format-interpolation
    "W0718", # exception-escape
    "W0511", # TODOs
]
